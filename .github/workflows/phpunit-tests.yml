name: Run PHPUnit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: Run tests (WP ${{ matrix.wp-version }}, PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php-version }}
      WP_ENV_CORE: ${{ matrix.wp-version == 'trunk' && 'WordPress/WordPress' || format( 'https://wordpress.org/wordpress-{0}.zip', matrix.wp-version ) }}
    strategy:
      matrix:
        php-version: [ '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
        wp-version: [ '6.2', '6.3', '6.4', '6.5', '6.6', '6.7', '6.8', '6.9' ]
        exclude:
          # PHP 8.5 exclusions
          - wp-version: '6.8'
            php-version: '8.5'
          - wp-version: '6.7'
            php-version: '8.5'
          - wp-version: '6.6'
            php-version: '8.5'
          - wp-version: '6.5'
            php-version: '8.5'
          - wp-version: '6.4'
            php-version: '8.5'
          - wp-version: '6.3'
            php-version: '8.5'
          - wp-version: '6.2'
            php-version: '8.5'

          # PHP 8.4 exclusions
          - wp-version: '6.6'
            php-version: '8.4'
          - wp-version: '6.5'
            php-version: '8.4'
          - wp-version: '6.4'
            php-version: '8.4'
          - wp-version: '6.3'
            php-version: '8.4'
          - wp-version: '6.2'
            php-version: '8.4'

          # PHP 8.3 exclusions
          - wp-version: '6.3'
            php-version: '8.3'
          - wp-version: '6.2'
            php-version: '8.3'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start the development environment
        run: npm run env start

      - name: Report Versions
        run: |
          npm run env run cli -- php -v
          npm run env run cli -- wp core version

      - name: Install fresh dependencies for PHP ${{ matrix.php-version }}
        run: rm composer.lock

      - name: Install Composer dependencies
        run: npm run test:php:install-deps

      - name: Run PHPUnit tests (single site)
        run: npm run test:php

      - name: Run PHPUnit tests (multisite)
        run: npm run test:php:multisite

  phpunit-coverage:
    name: PHPUnit Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start the development environment
        run: npm run env -- start --xdebug=coverage

      - name: Report Versions
        run: |
          npm run env run cli -- php -v
          npm run env run cli -- php -i | grep xdebug
          npm run env run cli -- wp core version

      - name: Install Composer dependencies
        run: npm run test:php:install-deps

      - name: Generate coverage report
        run: npm run test:php:coverage:report
