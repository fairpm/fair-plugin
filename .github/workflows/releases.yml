on:
  push:
    tags:
      - "**"

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.2'
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install Node dependencies
        run: npm install

      - name: Build project
        # Installs Composer dependencies, regenerates the POT, and builds the
        # plugin ZIP (with dependencies and built assets) at build/fair-plugin.zip.
        # bin/release.js fails the build if the ZIP is missing its entry file
        # or the Composer autoloader.
        run: |
          npm run release
          mv build/fair-plugin.zip /tmp/${{ github.event.repository.name }}-${{ github.ref_name }}.zip

      - name: Create WP distribution files
        run: bin/bundle.sh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            /tmp/${{ github.event.repository.name }}-${{ github.ref_name }}.zip
            /tmp/fair-dist/*

      - name: Upload to Fastly Object Storage
        # note the plugin filename is always 'fair-connect', regardless of the repo name or slug
        run: |
          aws s3 cp /tmp/${{ github.event.repository.name }}-${{ github.ref_name }}.zip s3://download.fair.pm/release/fair-connect-${{ github.ref_name }}.zip
          aws s3 cp --recursive --exclude '*'  --include '*.zip' /tmp/fair-dist s3://download.fair.pm/release/
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOAD_BUCKET_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOAD_BUCKET_SECRET_KEY }}
          AWS_DEFAULT_REGION: 'us-west'
          AWS_ENDPOINT_URL: 'https://us-west.object.fastlystorage.app'
          AWS_REQUEST_CHECKSUM_CALCULATION: 'WHEN_REQUIRED'

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: /tmp/${{ github.event.repository.name }}-${{ github.ref_name }}.zip
